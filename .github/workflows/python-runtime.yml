name: Python Runtime

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  python-runtime:
    name: Python 3.13 Runtime
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install Locked Dependencies
        run: |
          python -m pip install pipenv
          pipenv verify
          pipenv sync
          pipenv run python -m pip check
      - name: Check Application Imports
        run: |
          pipenv run python -c "import main; from kasa import SmartPlug; assert all(hasattr(SmartPlug, attr) for attr in ('emeter_realtime', 'emeter_today', 'emeter_this_month'))"
      - name: Set Up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build Runtime Images
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: false
